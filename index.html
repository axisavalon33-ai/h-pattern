/* ===================== BASE ===================== */
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: #05060f; color: #fff;

.screen {

#bottomRow { position: absolute; left: 2.2em; right: 2.2em; bottom: 0.9em; }
#line3 {

/* ----- Intro: "New discoveries around the world" ----- */
#intro {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  text-align: center; z-index: 60;
  opacity: 0; visibility: hidden;
  -webkit-transition: opacity 0.8s ease, visibility 0s linear 0.8s;
  transition: opacity 0.8s ease, visibility 0s linear 0.8s;
}
#slides.intro #intro {
  opacity: 1; visibility: visible;
  -webkit-transition: opacity 0.8s ease, visibility 0s linear 0s;
  transition: opacity 0.8s ease, visibility 0s linear 0s;
}

}
#slides.intro #stage, #slides.intro #subs, #slides.intro #pager { opacity: 0; }
#introInner {

}

}

#introKicker {

#introProgress {

#introBar { height: 100%; width: 0; background: linear-gradient(90deg, #2ee6ff, #8b5cff, #ff3db8, #ffb400); }

/* ----- Numbered pager ----- */
#pager {

<script>
/* =====================================================================
   ALL TEXT IS HERE  –  edit wording in this section only.
   ---------------------------------------------------------------------
   IMPORTANT: The Tamil (ta) and Sinhala (si) translations were written
   by a computer. Please ask a NATIVE SPEAKER of each language to check
   every line before the exhibition, and correct it here.

   To add a slide: copy one { ... } block in SLIDES, change the text,
   and put its video in the videos folder. Numbering and the pager
   update automatically.
   tag: "N" = Neurosurgery (cyan),  "D" = New discovery (magenta)
   ===================================================================== */

var UI = {
  en: { tile: "English", choose: "Choose your language",
        header: "Neurosurgery & Neuroscience",
        home: "Language",
        N: "Neurosurgery", D: "New discovery",
        introKicker: "Around the world",
        introTitle: "New discoveries and developments",
        introLines: [
          "The next screens show brain treatments and research from hospitals and laboratories around the world.",
          "Some are already used in Sri Lanka. Many are very new and not yet available here.",
          "They show where brain surgery and brain science are heading." ] },
  ta: { tile: "தமிழ்", choose: "உங்கள் மொழியைத் தெரிவுசெய்யுங்கள்",
        header: "நரம்பியல் சத்திரசிகிச்சை & நரம்பியல் விஞ்ஞானம்",
        home: "மொழி",
        N: "நரம்பியல் சத்திரசிகிச்சை", D: "புதிய கண்டுபிடிப்பு",
        introKicker: "உலகெங்கிலும்",
        introTitle: "புதிய கண்டுபிடிப்புகளும் முன்னேற்றங்களும்",
        introLines: [

      "වසර ගණනාවක් අංශභාගයෙන් සිටි අය ආධාර සහිතව ඇවිද ගිය අතර, සමහරුන් උපකරණය නිවා දැමූ විටත් දියුණුවක් පෙන්වූහ." ] } }
];

/* ===================== SETTINGS (safe to change) ===================== */
var SETTINGS = {
  introSeconds: 15,          // "New discoveries around the world" screen after choosing a language
  sentenceSeconds: 6.5,      // normal time each subtitle sentence stays on screen
  extraSecondsPerChar: 0.04, // longer sentences stay longer (per letter above 80)
  maxSentenceSeconds: 11,
  sideCardVideos: true,      // false = side cards show a colour card instead of video
                             //         (use this if the TV becomes slow or jerky)
  cursorHideSeconds: 3
};

/* =====================================================================
   PROGRAM  (no need to edit below this line)
   Written in plain old JavaScript so older Smart TV browsers work.
   ===================================================================== */
(function () {
  "use strict";

  var LANGS = ["en", "ta", "si"];
  var N = SLIDES.length;
  var FALLBACK_GRADIENTS = [
    "linear-gradient(135deg, #12c8ff 0%, #2a3bff 100%)",
    "linear-gradient(135deg, #ff3db8 0%, #7a2cff 100%)",
    "linear-gradient(135deg, #ffb31a 0%, #ff2d78 100%)",
    "linear-gradient(135deg, #2ee6a8 0%, #1d7bff 100%)",
    "linear-gradient(135deg, #8b5cff 0%, #ff3db8 100%)",
    "linear-gradient(135deg, #ff6a3d 0%, #b23dff 100%)"
  ];
  // cover-flow positions for distance 0, 1, 2, 3+ from the centre
  var FLOW = [
    { x: 0,    rot: 0,  scale: 1,    dim: 0,    op: 1 },
    { x: 0.47, rot: 62, scale: 0.56, dim: 0.45, op: 1 },
    { x: 0.62, rot: 66, scale: 0.46, dim: 0.62, op: 1 },
    { x: 0.72, rot: 70, scale: 0.34, dim: 0.8,  op: 0 }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var menuEl = $("menu"), slidesEl = $("slides"), menuVideo = $("menuVideo");
  var stage = $("stage"), subs = $("subs"), band = $("band");
  var tagEl = $("tag"), stitleEl = $("stitle"), sentenceEl = $("sentence");
  var sourceEl = $("source"), counterEl = $("counter"), barEl = $("bar");
  var pagerEl = $("pager");

  var mode = "menu";       // "menu", "intro" or "slides"
  var lang = "en";
  var tileIndex = 0;
  var current = 0;
  var lineIndex = 0;
  var timer = null, fadeTimer = null, bandTimer = null, introTimers = [];
  var cards = [], tiles = [], pagerItems = [];
  var missing = [];
  var layout = { cardW: 0, cardH: 0, top: 0 };

  /* ---------- helpers ---------- */
  function hasClass(el, c) { return (" " + el.className + " ").indexOf(" " + c + " ") > -1; }
  function addClass(el, c) { if (!hasClass(el, c)) { el.className = (el.className ? el.className + " " : "") + c; } }
  function removeClass(el, c) { el.className = (" " + el.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, ""); }
  function setTransform(el, t) { el.style.webkitTransform = t; el.style.transform = t; }
  function safePlay(v) {
    try { var p = v.play(); if (p && p["catch"]) { p["catch"](function () {}); } } catch (e) {}
  }
  function clearTimers() {
    clearTimeout(timer); clearTimeout(fadeTimer); clearTimeout(bandTimer);
    for (var i = 0; i < introTimers.length; i++) { clearTimeout(introTimers[i]); }
    introTimers = [];
  }

  /* ---------- build the language menu ---------- */
  function buildMenu() {
    var html = "";
    for (var i = 0; i < LANGS.length; i++) {
      html += '<div class="' + LANGS[i] + '">' + UI[LANGS[i]].choose + "</div>";
    }
    $("chooseText").innerHTML = html;
    var box = $("tiles");
    for (var j = 0; j < LANGS.length; j++) {
      var t = document.createElement("div");
      t.className = "tile " + LANGS[j];
      t.innerHTML = UI[LANGS[j]].tile;
      t.title = String(j + 1);
      (function (k) {
        t.onclick = function () { selectTile(k); chooseLanguage(LANGS[k]); };
        t.onmouseover = function () { selectTile(k); };
      })(j);
      box.appendChild(t);
      tiles.push(t);
    }
    selectTile(0);
  }
  function selectTile(k) {
    tileIndex = (k + tiles.length) % tiles.length;
    for (var i = 0; i < tiles.length; i++) {
      if (i === tileIndex) { addClass(tiles[i], "selected"); } else { removeClass(tiles[i], "selected"); }
    }
  }

  /* ---------- build cards and pager ---------- */
  function buildSlides() {
    for (var i = 0; i < N; i++) {
      var c = document.createElement("div");
      c.className = "card tag" + SLIDES[i].tag;
      c.innerHTML =
        '<div class="fallback" style="background:' + FALLBACK_GRADIENTS[i % FALLBACK_GRADIENTS.length] + '">' +
          '<div class="num">' + (i + 1) + '</div><div class="ftitle"></div></div>' +
        '<video muted loop playsinline preload="auto"></video>' +
        '<div class="dim"></div>';
      var v = c.getElementsByTagName("video")[0];
      v.muted = true;
      v.setAttribute("muted", "");
      v.setAttribute("playsinline", "");
      v.setAttribute("webkit-playsinline", "");
      (function (idx, card, video) {
        video.addEventListener("loadeddata", function () { addClass(card, "ready"); });
        video.addEventListener("error", function () {
          if (!video.getAttribute("src")) { return; }   // ignore errors from unloading
          missing[idx] = true;
          addClass(card, "missing");
          video.removeAttribute("src");
        });
        card.onclick = function () { if (idx !== current) { goTo(idx); } };
      })(i, c, v);
      stage.appendChild(c);
      cards.push({ el: c, video: v, title: c.getElementsByTagName("div")[2] });
      missing.push(false);
    }

    var prev = document.createElement("span");
    prev.className = "arrow"; prev.innerHTML = "&#9664;";
    prev.onclick = function () { prevSlide(); };
    pagerEl.appendChild(prev);
    for (var j = 0; j < N; j++) {
      var p = document.createElement("span");
      p.innerHTML = String(j + 1);
      (function (k) { p.onclick = function () { goTo(k); }; })(j);
      pagerEl.appendChild(p);
      pagerItems.push(p);
    }
    var next = document.createElement("span");
    next.className = "arrow"; next.innerHTML = "&#9654;";
    next.onclick = function () { nextSlide(); };
    pagerEl.appendChild(next);
  }

  /* ---------- sizes (everything scales with the screen) ---------- */
  function computeLayout() {
    var W = window.innerWidth, H = window.innerHeight;
    // top to bottom: header, video card, subtitle panel, number buttons
    var areaTop = H * 0.085, pagerTop = H * 0.905, gap = H * 0.016;
    var panelH = H * 0.235;
    var cardH = pagerTop - gap - panelH - gap - areaTop;
    var cardW = Math.min(W * 0.70, cardH * 16 / 9);
    cardH = cardW * 9 / 16;
    var panelW = Math.min(W * 0.86, Math.max(cardW, W * 0.80));
    layout.cardW = cardW; layout.cardH = cardH; layout.top = areaTop;
    for (var i = 0; i < cards.length; i++) {
      var s = cards[i].el.style;
      s.width = cardW + "px"; s.height = cardH + "px";
      s.marginLeft = (-cardW / 2) + "px"; s.top = areaTop + "px";
      s.fontSize = (cardW / 100) + "px";
    }
    subs.style.width = panelW + "px"; subs.style.height = panelH + "px";
    subs.style.left = ((W - panelW) / 2) + "px"; subs.style.top = (areaTop + cardH + gap) + "px";
    subs.style.fontSize = (Math.min(W / 100, H / 56.25)) + "px";
    stage.style.webkitPerspective = (W * 2) + "px";
    stage.style.perspective = (W * 2) + "px";
    if (mode === "slides") { positionCards(); fitSentence(); }
    fitIntro();
  }

  function positionCards() {
    for (var i = 0; i < cards.length; i++) {
      var d = i - current, a = Math.abs(d), f = FLOW[Math.min(a, 3)];
      var sign = d < 0 ? -1 : 1;
      var el = cards[i].el;
      setTransform(el, "translateX(" + (sign * f.x * layout.cardW) + "px) rotateY(" +
        (-sign * f.rot) + "deg) scale(" + f.scale + ")");
      el.style.opacity = f.op;
      el.style.zIndex = 20 - a;
      el.getElementsByTagName("div")[3].style.opacity = f.dim;
      if (d === 0) { addClass(el, "center"); } else { removeClass(el, "center"); }
    }
    for (var j = 0; j < pagerItems.length; j++) {
      pagerItems[j].className = j === current ? "current" : "";
    }
  }

  /* ---------- video control: only the centre video plays ---------- */
  function loadVideo(i) {
    var v = cards[i].video;
    if (missing[i] || v.getAttribute("src")) { return; }
    v.setAttribute("src", SLIDES[i].video);
    try { v.load(); } catch (e) {}
  }
  function unloadVideo(i) {
    var v = cards[i].video;
    if (!v.getAttribute("src")) { return; }
    try { v.pause(); } catch (e) {}
    v.removeAttribute("src");
    try { v.load(); } catch (e) {}
    removeClass(cards[i].el, "ready");
  }
  function updateVideos() {
    for (var i = 0; i < cards.length; i++) {
      var a = Math.abs(i - current);
      var keep = mode === "slides" && (a === 0 || (SETTINGS.sideCardVideos && a <= 2));
      if (!keep) { unloadVideo(i); continue; }
      loadVideo(i);
      var v = cards[i].video;
      if (a === 0) {
        try { v.currentTime = 0; } catch (e) {}
        safePlay(v);
      } else {
        try { v.pause(); } catch (e2) {}
      }
    }
  }

  /* ---------- subtitles ---------- */
  function sentenceMs(text) {
    var s = SETTINGS.sentenceSeconds + Math.max(0, text.length - 80) * SETTINGS.extraSecondsPerChar;
    return Math.min(s, SETTINGS.maxSentenceSeconds) * 1000;
  }
  function fitSentence() {
    // big bold text; shrink a little only if it would run into the source line
    var base = lang === "en" ? 2.35 : 2.05;   // in "em" of the panel text size
    var min = base * 0.75, size = base;
    sentenceEl.style.fontSize = size + "em";
    var limit = $("bottomRow").getBoundingClientRect().top - 4;
    while (size > min && sentenceEl.getBoundingClientRect().bottom > limit) {
      size -= 0.05;
      sentenceEl.style.fontSize = size + "em";
    }
  }
  function setBar(fromFrac, toFrac, ms) {
    barEl.style.webkitTransition = "none"; barEl.style.transition = "none";
    barEl.style.width = (fromFrac * 100) + "%";
    void barEl.offsetWidth;   // apply before starting the animation
    var t = "width " + ms + "ms linear";
    barEl.style.webkitTransition = t; barEl.style.transition = t;
    barEl.style.width = (toFrac * 100) + "%";
  }
  function showLine(k) {
    var lines = SLIDES[current][lang].lines;
    lineIndex = k;
    sentenceEl.innerHTML = lines[k];
    fitSentence();
    addClass(sentenceEl, "show");
    var ms = sentenceMs(lines[k]);
    setBar(k / lines.length, (k + 1) / lines.length, ms + (k < lines.length - 1 ? 500 : 0));
    timer = setTimeout(function () {
      if (k < lines.length - 1) {
        removeClass(sentenceEl, "show");
        fadeTimer = setTimeout(function () { showLine(k + 1); }, 500);
      } else {
        nextSlide(true);
      }
    }, ms);
  }
  function startSubtitles() {
    var s = SLIDES[current], t = s[lang];
    removeClass(band, "show");
    removeClass(sentenceEl, "show");
    bandTimer = setTimeout(function () {
      tagEl.className = "tag" + s.tag;
      band.className = band.className.replace(/\s*tag[ND]/g, "") + " tag" + s.tag;
      tagEl.innerHTML = UI[lang][s.tag];
      stitleEl.innerHTML = t.title;
      sourceEl.innerHTML = "Source: " + s.source;
      counterEl.innerHTML = (current + 1) + " / " + N;
      addClass(band, "show");
      showLine(0);
    }, 900);
  }

  /* ---------- navigation ---------- */
  function goTo(i) {
    if (mode !== "slides") { return; }
    clearTimers();
    current = (i + N) % N;
    positionCards();
    updateVideos();
    startSubtitles();
  }
  function nextSlide(auto) {
    if (current >= N - 1) {
      if (auto) { showMenu(); return; }   // finished the last slide: back to the menu
      goTo(0); return;
    }
    goTo(current + 1);
  }
  function prevSlide() { goTo(current - 1); }

  function applyLanguage() {
    document.documentElement.lang = lang;
    $("headerText").innerHTML = UI[lang].header;
    $("homeText").innerHTML = UI[lang].home;
    $("introKicker").innerHTML = UI[lang].introKicker;
    $("introTitle").getElementsByTagName("span")[0].innerHTML = UI[lang].introTitle;
    var il = introLineList();
    for (var j = 0; j < il.length; j++) { il[j].innerHTML = UI[lang].introLines[j] || ""; }
    fitIntro();
    for (var i = 0; i < cards.length; i++) { cards[i].title.innerHTML = SLIDES[i][lang].title; }
  }

  function introLineEls() { return $("introInner").getElementsByTagName("div"); }
  function introLineList() {
    var all = introLineEls(), out = [];
    for (var i = 0; i < all.length; i++) { if (hasClass(all[i], "introLine")) { out.push(all[i]); } }
    return out;
  }

  // shrink the intro text block if it would run into the progress bar
  function fitIntro() {
    var inner = $("introInner");
    setTransform(inner, "none");
    var room = window.innerHeight * 0.92 - inner.offsetTop;
    var h = inner.offsetHeight;
    if (h > room) { setTransform(inner, "scale(" + (room / h) + ")"); }
  }

  function chooseLanguage(l) {
    if (mode !== "menu") { return; }
    lang = l;
    applyLanguage();
    mode = "intro";
    armBackGuard();
    requestWakeLock();
    removeClass(menuEl, "active");
    addClass(slidesEl, "intro");
    addClass(slidesEl, "active");
    try { menuVideo.pause(); } catch (e) {}
    current = 0;
    computeLayout();
    positionCards();
    // "New discoveries around the world" screen, lines appear one by one
    var lines = introLineList(), ms = SETTINGS.introSeconds * 1000;
    for (var i = 0; i < lines.length; i++) {
      removeClass(lines[i], "show");
      (function (el, delay) {
        introTimers.push(setTimeout(function () { addClass(el, "show"); }, delay));
      })(lines[i], 900 + i * 1600);
    }
    var bar = $("introBar");
    bar.style.webkitTransition = "none"; bar.style.transition = "none"; bar.style.width = "0%";
    void bar.offsetWidth;
    bar.style.webkitTransition = "width " + ms + "ms linear"; bar.style.transition = "width " + ms + "ms linear";
    bar.style.width = "100%";
    introTimers.push(setTimeout(startCarousel, ms));
  }

  function startCarousel() {
    if (mode !== "intro") { return; }
    clearTimers();
    mode = "slides";
    removeClass(slidesEl, "intro");
    current = 0;
    positionCards();
    updateVideos();
    startSubtitles();
  }

  function showMenu() {
    if (mode === "menu") { return; }
    clearTimers();
    mode = "menu";
    removeClass(band, "show");
    removeClass(slidesEl, "active");
    removeClass(slidesEl, "intro");
    addClass(menuEl, "active");
    updateVideos();            // unloads all slide videos
    selectTile(0);
    safePlay(menuVideo);
  }

  /* ---------- TV remote / keyboard ---------- */
  var KEY_LEFT = 37, KEY_RIGHT = 39, KEY_ENTER = 13, KEY_SPACE = 32;
  var BACK_KEYS = { 10009: 1, 461: 1, 27: 1, 8: 1 };   // Samsung, LG, Esc, Backspace

  // other buttons that act the same (presentation clickers, keyboards, remotes)
  var KEY_ALIASES = {
    33: KEY_LEFT, 38: KEY_LEFT,      // Page Up (clicker "back"), Up arrow
    34: KEY_RIGHT, 40: KEY_RIGHT,    // Page Down (clicker "next"), Down arrow
    116: KEY_ENTER, 190: KEY_ENTER   // F5 / "." (clicker "play" or "blank" button)
  };
  // number keys 1, 2, 3 on a remote or keyboard pick a language straight away
  var NUMBER_LANG = { 49: 0, 50: 1, 51: 2, 97: 0, 98: 1, 99: 2 };

  document.addEventListener("keydown", function (e) {
    var k = e.keyCode || e.which;
    if (mode === "menu" && NUMBER_LANG.hasOwnProperty(k)) {
      selectTile(NUMBER_LANG[k]); chooseLanguage(LANGS[NUMBER_LANG[k]]); e.preventDefault(); return;
    }
    if (KEY_ALIASES.hasOwnProperty(k)) { k = KEY_ALIASES[k]; }
    if (mode === "menu" && menuVideo.paused) { safePlay(menuVideo); }
    if (mode === "menu") {
      if (k === KEY_LEFT) { selectTile(tileIndex - 1); e.preventDefault(); }
      else if (k === KEY_RIGHT) { selectTile(tileIndex + 1); e.preventDefault(); }
      else if (k === KEY_ENTER || k === KEY_SPACE) { chooseLanguage(LANGS[tileIndex]); e.preventDefault(); }
      else if (BACK_KEYS[k]) { e.preventDefault(); }   // stay on the menu, don't leave the page
    } else if (mode === "intro") {
      if (k === KEY_RIGHT || k === KEY_ENTER || k === KEY_SPACE) { startCarousel(); e.preventDefault(); }
      else if (BACK_KEYS[k]) { showMenu(); e.preventDefault(); }
    } else {
      if (k === KEY_LEFT) { prevSlide(); e.preventDefault(); }
      else if (k === KEY_RIGHT) { nextSlide(false); e.preventDefault(); }
      else if (BACK_KEYS[k]) { showMenu(); e.preventDefault(); }
    }
  }, false);

  /* The TV browser's own BACK button may try to leave the page.
     We keep an extra history entry so BACK just returns to the menu. */
  var guardArmed = false;
  function armBackGuard() {
    if (guardArmed || !window.history || !history.pushState) { return; }
    try { history.pushState({ medscope: 1 }, ""); guardArmed = true; } catch (e) {}
  }
  window.addEventListener("popstate", function () {
    guardArmed = false;
    showMenu();
    armBackGuard();
  }, false);

  /* ---------- hide the mouse cursor when idle ---------- */
  var cursorTimer = null;
  document.addEventListener("mousemove", function () {
    removeClass(document.body, "hide-cursor");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(function () { addClass(document.body, "hide-cursor"); },
      SETTINGS.cursorHideSeconds * 1000);
  }, false);

  /* ---------- keep the screen awake ---------- */
  var wakeLock = null;
  function requestWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request && !wakeLock) {
        navigator.wakeLock.request("screen").then(function (l) {
          wakeLock = l;
          l.addEventListener("release", function () { wakeLock = null; });
        })["catch"](function () {});
      }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { requestWakeLock(); }
  }, false);
  document.addEventListener("click", requestWakeLock, false);

  /* ---------- start ---------- */
  menuVideo.muted = true;
  menuVideo.addEventListener("error", function () { menuVideo.style.display = "none"; });
  buildMenu();
  buildSlides();
  applyLanguage();
  computeLayout();
  positionCards();
  window.addEventListener("resize", computeLayout, false);
  $("intro").onclick = function () { startCarousel(); };
  $("homeBtn").onclick = function (e) { if (e && e.stopPropagation) { e.stopPropagation(); } showMenu(); };

  /* ---------- touch screen: swipe left / right to change slides ---------- */
  var touchX = null, touchY = null;
  slidesEl.addEventListener("touchstart", function (e) {
    if (e.touches && e.touches.length === 1) { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }
    else { touchX = null; }
  }, false);
  slidesEl.addEventListener("touchend", function (e) {
    if (touchX === null || !e.changedTouches || !e.changedTouches.length) { return; }
    var dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    if (Math.abs(dx) < window.innerWidth * 0.06 || Math.abs(dx) < Math.abs(dy)) { return; }
    if (mode === "intro") { startCarousel(); }
    else if (mode === "slides") { if (dx < 0) { nextSlide(false); } else { prevSlide(); } }
  }, false);
  // no long-press menu on the touch screen
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, false);
  safePlay(menuVideo);
  requestWakeLock();
})();
</script>
</body>
</html>
